<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local Genshin Impact upgrade notes list">
  <title>Genshin Notes</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11131a;
      --panel: #1b1f2a;
      --panel-2: #242a39;
      --text: #f4f5f7;
      --muted: #aeb6c7;
      --accent: #ffc857;
      --accent-2: #79c9ff;
      --danger: #ff8e8e;
      --line: #3a4255;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: radial-gradient(circle at 50% -10%, #26314a 0, var(--bg) 45rem);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(960px, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0; }
    h1 { margin: 0 0 .35rem; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.04em; }
    .subtitle { color: var(--muted); margin: 0 0 2rem; }
    .composer, .status, .empty { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 16px; }
    .composer { display: flex; gap: .75rem; padding: .75rem; box-shadow: 0 1rem 3rem #0004; }
    .composer input {
      flex: 1; min-width: 0; border: 0; border-radius: 10px; background: var(--panel-2); color: var(--text);
      font: inherit; padding: .85rem 1rem; outline: 2px solid transparent;
    }
    .composer input:focus { outline-color: var(--accent-2); }
    button { border: 0; border-radius: 10px; cursor: pointer; font: inherit; }
    .add-button { background: var(--accent); color: #211b0a; font-weight: 700; padding: 0 1.2rem; }
    button:focus-visible, [draggable="true"]:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
    .status { margin: 1rem 0; padding: .8rem 1rem; color: var(--muted); }
    .status.error { color: var(--danger); }
    .status.ready { color: #b9e7c0; }
    .notes { display: grid; gap: .7rem; margin-top: 1.25rem; }
    .note {
      display: grid; grid-template-columns: 2.7rem 3.5rem minmax(10rem, 19rem) 1fr auto 2.3rem; align-items: center; gap: .8rem;
      min-height: 74px; padding: .55rem .75rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      transition: opacity .15s, transform .15s, border-color .15s;
    }
    .note.dragging { opacity: .45; transform: scale(.99); border-color: var(--accent-2); }
    .note.not-today { opacity: .52; }
    .complete { width: 2.2rem; height: 2.2rem; background: transparent; color: var(--muted); font-size: 1.55rem; }
    .complete:hover { color: var(--accent); }
    .avatar { width: 3.5rem; height: 3.5rem; object-fit: cover; border-radius: 10px; background: var(--panel-2); }
    .note-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 750; color: var(--accent-2); }
    .note-text { min-width: 0; overflow-wrap: anywhere; }
    .note-days { color: var(--accent); font-size: .9rem; white-space: nowrap; }
    .drag-handle { display: grid; place-items: center; width: 2rem; height: 2.5rem; color: var(--muted); cursor: grab; font-size: 1.4rem; user-select: none; }
    .drag-handle:active { cursor: grabbing; }
    .empty { padding: 2rem; text-align: center; color: var(--muted); }
    .hint { margin: 1rem 0 0; color: var(--muted); font-size: .9rem; }
    @media (max-width: 680px) {
      main { padding: 2rem 0; }
      .composer { flex-direction: column; }
      .add-button { padding: .8rem; }
      .note { grid-template-columns: 2.5rem 3rem 1fr auto 2rem; gap: .55rem; }
      .avatar { width: 3rem; height: 3rem; }
      .note-title { grid-column: 3; }
      .note-text { grid-column: 3; grid-row: 2; }
      .note-days { grid-column: 3 / span 2; grid-row: 3; }
      .note { grid-template-rows: auto auto; }
      .complete { grid-row: 1 / span 2; }
      .avatar { grid-row: 1 / span 2; }
      .drag-handle { grid-row: 1 / span 2; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Genshin Notes</h1>
    <p class="subtitle">Keep upgrade priorities locally in your browser.</p>
    <form class="composer" id="note-form">
      <input id="note-input" autocomplete="off" placeholder="e.g. Raiden level 90 talents" aria-label="New note" required>
      <button class="add-button" type="submit">Add note</button>
    </form>
    <div class="status" id="status" role="status" aria-live="polite">Loading characters and weapons…</div>
    <section class="notes" id="notes" aria-label="Upgrade notes"></section>
    <p class="hint">Drag the handle to change priority. Notes and completion status are saved automatically.</p>
  </main>
  <script>
    (() => {
      "use strict";
      const API_ROOT = "https://gi.yatta.moe/api/v2/en";
      const IMAGE_ROOT = "https://gi.yatta.moe/assets/UI";
      const ENKA_IMAGE_ROOT = "https://enka.network/ui";
      const CATALOG_KEY = "genshin-notes.catalog.v1";
      const NOTES_KEY = "genshin-notes.notes.v1";
      const state = { catalog: [], notes: loadNotes(), draggedId: null };
      const form = document.querySelector("#note-form");
      const input = document.querySelector("#note-input");
      const status = document.querySelector("#status");
      const notesElement = document.querySelector("#notes");

      function setStatus(message, kind) {
        status.textContent = message;
        status.className = `status${kind ? ` ${kind}` : ""}`;
      }
      function readStorage(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch (error) {
          console.warn(`Could not read ${key} from localStorage.`, error);
          return fallback;
        }
      }
      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {
          setStatus("Changes could not be saved in this browser.", "error");
          console.warn(`Could not write ${key} to localStorage.`, error);
        }
      }
      function loadNotes() {
        const notes = readStorage(NOTES_KEY, []);
        return Array.isArray(notes) ? notes.filter(note => note && note.id && note.title).map(note => ({
          ...note,
          image: migrateImageUrl(note.image)
        })) : [];
      }
      function normalize(value) {
        return value.toLocaleLowerCase("en").replace(/[^a-z0-9]+/g, "");
      }
      function imageFor(item) {
        return `${IMAGE_ROOT}/${encodeURIComponent(item.icon)}.png`;
      }
      function migrateImageUrl(image) {
        return image?.replace("https://gi.yatta.moe/images/avatar/", `${IMAGE_ROOT}/`)
          .replace("https://gi.yatta.moe/images/weapon/", `${IMAGE_ROOT}/`)
          .replace(`${IMAGE_ROOT}/avatar/`, `${IMAGE_ROOT}/`)
          .replace(`${IMAGE_ROOT}/weapon/`, `${IMAGE_ROOT}/`);
      }
      function toCatalog(kind, payload) {
        return Object.values(payload?.data?.items || {}).filter(item => item?.name && item?.icon).map(item => ({
          id: `${kind}-${item.id}`, kind, name: item.name, icon: item.icon, image: imageFor({ kind, icon: item.icon })
        }));
      }
      async function fetchCatalog() {
        const [avatarResponse, weaponResponse] = await Promise.all([
          fetch(`${API_ROOT}/avatar`), fetch(`${API_ROOT}/weapon`)
        ]);
        if (!avatarResponse.ok || !weaponResponse.ok) throw new Error("The catalog request failed.");
        const [avatars, weapons] = await Promise.all([avatarResponse.json(), weaponResponse.json()]);
        const catalog = [...toCatalog("character", avatars), ...toCatalog("weapon", weapons)];
        if (!catalog.length) throw new Error("The API returned an empty catalog.");
        return catalog;
      }
      function bestMatch(word) {
        const target = normalize(word);
        if (!target) return null;
        let best = null;
        for (const item of state.catalog) {
          const candidate = normalize(item.name);
          let score = candidate === target ? 1 : candidate.startsWith(target) ? .9 : candidate.includes(target) ? .78 : similarity(target, candidate);
          if (!best || score > best.score) best = { item, score };
        }
        return best && (best.score >= .36 || best.item.name.toLocaleLowerCase("en").startsWith(word.toLocaleLowerCase("en"))) ? best.item : null;
      }
      function similarity(a, b) {
        if (!a || !b) return 0;
        const previous = Array.from({ length: b.length + 1 }, (_, i) => i);
        for (let i = 1; i <= a.length; i++) {
          let diagonal = previous[0];
          previous[0] = i;
          for (let j = 1; j <= b.length; j++) {
            const saved = previous[j];
            previous[j] = Math.min(previous[j] + 1, previous[j - 1] + 1, diagonal + (a[i - 1] === b[j - 1] ? 0 : 1));
            diagonal = saved;
          }
        }
        return 1 - previous[b.length] / Math.max(a.length, b.length);
      }
      function isTalentsWord(word) {
        const target = normalize(word);
        return target === "talent" || target === "talents" || similarity(target, "talents") >= .58;
      }
      function sortDays(days) {
        const order = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
        return [...days].sort((a, b) => order.indexOf(a) - order.indexOf(b));
      }
      function todayName() {
        return ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"][new Date().getDay()];
      }
      function daysLabel(days) {
        const labels = { monday: "Mon", tuesday: "Tue", wednesday: "Wed", thursday: "Thu", friday: "Fri", saturday: "Sat", sunday: "Sun" };
        return days.map(day => labels[day] || day).join(", ");
      }
      async function fetchMaterialDays(materialIds) {
        const materialDetails = await Promise.all([...materialIds].map(async id => {
          const materialResponse = await fetch(`${API_ROOT}/material/${encodeURIComponent(id)}`);
          if (!materialResponse.ok) return null;
          return (await materialResponse.json())?.data;
        }));
        const days = new Set();
        materialDetails.filter(Boolean).forEach(material => {
          (material.source || []).filter(source => source.type === "domain").forEach(source => {
            (source.days || []).forEach(day => days.add(day.toLowerCase()));
          });
        });
        return sortDays(days);
      }
      async function fetchTalentDays(characterId) {
        const response = await fetch(`${API_ROOT}/avatar/${encodeURIComponent(characterId)}`);
        if (!response.ok) throw new Error("The character talent request failed.");
        const payload = await response.json();
        const character = payload?.data;
        const materialIds = new Set();
        Object.values(character?.talent || {}).forEach(talent => {
          Object.values(talent?.promote || {}).forEach(level => {
            Object.keys(level?.costItems || {}).forEach(id => materialIds.add(id));
          });
        });
        return fetchMaterialDays(materialIds);
      }
      async function fetchWeaponDays(weaponId) {
        const response = await fetch(`${API_ROOT}/weapon/${encodeURIComponent(weaponId)}`);
        if (!response.ok) throw new Error("The weapon upgrade request failed.");
        const payload = await response.json();
        const weapon = payload?.data;
        const materialIds = new Set();
        (weapon?.upgrade?.promote || []).forEach(level => {
          Object.keys(level?.costItems || {}).forEach(id => materialIds.add(id));
        });
        return fetchMaterialDays(materialIds);
      }
      function render() {
        notesElement.replaceChildren();
        if (!state.notes.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No notes yet. Add your first upgrade priority above.";
          notesElement.append(empty);
          return;
        }
        state.notes.forEach(note => {
          const row = document.createElement("article");
          row.className = `note${note.availableDays?.length && !note.availableDays.includes(todayName()) ? " not-today" : ""}`;
          row.dataset.id = note.id;
          const complete = document.createElement("button");
          complete.className = "complete";
          complete.type = "button";
          complete.title = "Complete note";
          complete.setAttribute("aria-label", complete.title);
          complete.textContent = "🔥";
          complete.addEventListener("click", () => {
            state.notes = state.notes.filter(item => item.id !== note.id);
            writeStorage(NOTES_KEY, state.notes);
            render();
          });
          const image = document.createElement("img");
          image.className = "avatar";
          image.src = note.image;
          image.alt = `${note.title} icon`;
          image.loading = "lazy";
          const imageCandidates = [
            image.src,
            image.src.replace(IMAGE_ROOT, ENKA_IMAGE_ROOT)
          ];
          let imageIndex = 0;
          image.addEventListener("error", () => {
            imageIndex += 1;
            if (imageIndex < imageCandidates.length) image.src = imageCandidates[imageIndex];
            else {
              image.removeAttribute("src");
              image.alt = `${note.title} image unavailable`;
            }
          });
          const title = document.createElement("strong");
          title.className = "note-title";
          title.textContent = note.title;
          title.title = note.title;
          const text = document.createElement("span");
          text.className = "note-text";
          text.textContent = note.rest || (note.kind === "weapon" ? "lvl" : note.talentNote ? "talents" : "Upgrade priority");
          const days = document.createElement("span");
          days.className = "note-days";
          days.textContent = note.availableDays?.length ? `Materials: ${daysLabel(note.availableDays)}` : "";
          days.title = "Talent materials are available on these days";
          const handle = document.createElement("span");
          handle.className = "drag-handle";
          handle.textContent = "⠿";
          handle.title = "Drag to reorder";
          handle.setAttribute("aria-label", "Drag to reorder");
          handle.draggable = true;
          handle.addEventListener("dragstart", event => { state.draggedId = note.id; row.classList.add("dragging"); event.dataTransfer.effectAllowed = "move"; });
          handle.addEventListener("dragend", () => { state.draggedId = null; row.classList.remove("dragging"); });
          row.addEventListener("dragover", event => { event.preventDefault(); });
          row.addEventListener("drop", event => {
            event.preventDefault();
            const from = state.notes.findIndex(item => item.id === state.draggedId);
            const to = state.notes.findIndex(item => item.id === note.id);
            if (from >= 0 && to >= 0 && from !== to) {
              const [moved] = state.notes.splice(from, 1);
              state.notes.splice(to, 0, moved);
              writeStorage(NOTES_KEY, state.notes);
              render();
            }
          });
          row.append(complete, image, title, text, days, handle);
          notesElement.append(row);
        });
      }
      form.addEventListener("submit", async event => {
        event.preventDefault();
        const raw = input.value.trim();
        if (!raw) return;
        const words = raw.split(/\s+/);
        const match = bestMatch(words[0].replace(/[.,!?;:]+$/, ""));
        const talentRequest = match?.kind === "character" && words[1] && isTalentsWord(words[1]);
        const weaponRequest = match?.kind === "weapon";
        let availableDays = [];
        if (talentRequest || weaponRequest) {
          setStatus(`Loading ${weaponRequest ? "weapon" : "talent"} materials for ${match.name}…`);
          try {
            availableDays = weaponRequest
              ? await fetchWeaponDays(match.id.replace("weapon-", ""))
              : await fetchTalentDays(match.id.replace("character-", ""));
          } catch (error) {
            setStatus(`The note was added, but ${weaponRequest ? "weapon" : "talent"} material days could not be loaded.`, "error");
            console.error(`${weaponRequest ? "Weapon" : "Talent"} material loading failed.`, error);
          }
        }
        const first = words.shift();
        if (talentRequest) words.shift();
        if (weaponRequest) {
          const weaponNameWordCount = match.name.split(/\s+/).length;
          words.splice(0, Math.max(0, weaponNameWordCount - 1));
        }
        const defaultText = talentRequest ? "talents" : weaponRequest ? "lvl" : "Upgrade priority";
        const note = {
          id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          title: match ? match.name : first,
          rest: words.join(" ") || defaultText,
          image: match ? match.image : "",
          availableDays,
          kind: match?.kind || "",
          talentNote: talentRequest,
          done: false
        };
        state.notes.unshift(note);
        writeStorage(NOTES_KEY, state.notes);
        if (talentRequest || weaponRequest) {
          setStatus(availableDays.length
            ? `Added ${match.name} material days: ${daysLabel(availableDays)}.`
            : `Added ${match.name}, but no material schedule was found.`, availableDays.length ? "ready" : "error");
        } else {
          setStatus("Note added.", "ready");
        }
        input.value = "";
        render();
        input.focus();
      });
      async function init() {
        const cached = readStorage(CATALOG_KEY, []);
        if (Array.isArray(cached) && cached.length) {
          state.catalog = cached.map(item => ({ ...item, image: migrateImageUrl(item.image) }));
          setStatus(`Ready with ${cached.length} cached characters and weapons.`, "ready");
        }
        try {
          const catalog = await fetchCatalog();
          state.catalog = catalog;
          writeStorage(CATALOG_KEY, catalog);
          setStatus(`Ready: ${catalog.length} characters and weapons loaded.`, "ready");
        } catch (error) {
          if (state.catalog.length) setStatus("Using cached characters and weapons. Live refresh failed.", "error");
          else setStatus("Could not load the catalog. Connect to the internet and reload this file.", "error");
          console.error("Catalog loading failed.", error);
        }
        render();
      }
      render();
      init();
    })();
  </script>
</body>
</html>
